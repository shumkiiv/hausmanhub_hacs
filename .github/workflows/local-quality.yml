name: Проверка качества HausmanHub

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  local-check:
    name: Проверить файлы проекта
    runs-on: ubuntu-latest
    steps:
      - name: Получить файлы проекта
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Подготовить Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Подготовить Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
      - name: Установить проверки схем и покрытия
        run: python3 -m pip install --disable-pip-version-check jsonschema==4.25.1 coverage==7.10.7 pytest==8.3.5
      - name: Установить browser-gate
        run: npm ci
      - name: Установить Chromium
        run: npx playwright install --with-deps chromium
      - name: Запустить проверки HausmanHub
        run: python3 tools/check_local_release.py
      - name: Проверить branch coverage критического runtime
        run: python3 tools/check_critical_coverage.py
      - name: Проверить интерфейс в браузере
        run: npm run test:browser
      - name: Сохранить отчёт browser-gate при ошибке
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: hausman-hacs-browser-gate
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
