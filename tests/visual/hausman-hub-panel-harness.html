<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>HausmanHub panel visual harness</title>
    <style>
      html, body { min-height: 100%; margin: 0; background: #eef1f6; }
      hausman-hub-panel { min-height: 100vh; }
    </style>
  </head>
  <body>
    <hausman-hub-panel id="panel"></hausman-hub-panel>
    <script src="../../custom_components/hausman_hub/frontend/hausman-hub-panel.js"></script>
    <script>
      const params = new URLSearchParams(window.location.search);
      const panel = document.getElementById("panel");
      const theme = params.get("theme") === "dark" ? "dark" : "light";
      panel._themeMode = theme;
      panel.classList.toggle("theme-light", theme === "light");
      document.documentElement.style.background = theme === "light" ? "#eef1f6" : "#0b0f14";
      document.body.style.background = theme === "light" ? "#eef1f6" : "#0b0f14";
      panel._data = {
        integration_version: "1.38.1",
        readiness: { status: "ready", bridge_mode: "native", reasons: [] },
        snapshot: null,
      };
      panel._settings.setup = { status: "configured" };
      panel._activeSection = params.get("section") || "overview";
      panel._render();
      panel.shadowRoot.querySelector("link").href =
        "../../custom_components/hausman_hub/frontend/hausman-hub-panel.css";
      if (params.get("screen") === "assistant") {
        panel._assistant = {
          loaded: true,
          loading: false,
          error: false,
          fields: null,
          data: {
            settings: {
              enabled: true,
              preset: "deepseek",
              base_url: "https://api.deepseek.com",
              model: "deepseek-chat",
              key_set: true,
            },
            stats: {
              aggregates: [
                { calls: 24, successes: 23, prompt_tokens: 18420, completion_tokens: 4880, latency_ms: 20208 },
              ],
              recent_calls: [
                { ts: 1785241920000, preset: "DeepSeek", model: "deepseek-chat", status: "ready" },
                { ts: 1785229500000, preset: "DeepSeek", model: "deepseek-chat", status: "ready" },
              ],
            },
            last_advisory: {
              status: "ready",
              generated_at: 1785241920000,
              recommendations: [
                { code: "review_temperature_gap", room_id: "living_room" },
                { code: "verify_window_state", room_id: "bedroom" },
              ],
              risk_flags: [{ code: "temperature_outside_comfort_band", room_id: "bathroom" }],
            },
          },
        };
        for (const name of ["contour", "profiles", "schedule", "home", "windows"]) {
          panel._shell[name].hidden = true;
        }
        panel._shell.brandSubtitle.textContent = "Советы и статистика AI";
        panel._renderAssistant(panel._shell.assistant);
      }
    </script>
  </body>
</html>
